        <body>
            You want lists on HTML? <br>

            You can do Unordered Lists 
            <ul> 
                <li> An Item      </li> <!-- <li> stands for List Item -->
                <li> Another Item </li> 
            </ul>

            Maybe you want an Order one?
            <ol>
                <li> Item #1 </li>
                <li> Item #2 </li>
            </ol>

            How about a descriptive list?
            <dl>
                <dt> HTML         </dt>
                    <dd> This adds stucture to a webpage </dd>
                <dt> CSS         </dt>
                    <dd> This adds style to a webpage </dd>
                <dt> Javascript         </dt>
                    <dd> This adds functionality to a webpage </dd>
            </dl>

            Thats about it.
        </body>
