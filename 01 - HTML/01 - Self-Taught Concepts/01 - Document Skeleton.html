<!DOCTYPE html> <!-- This tells the browser that this is an HTML file -->

<html>      <!-- This capsule contains all HTML code              -->
    <head>
        <!-- This is where you write the name for the tab -->
        <title> A Website </title>
        <!-- You also write metadata for this HTML file   -->
    </head>

    <body>
        <!-- This is where all the meat and potatoes go -->
    </body>
</html>

<!-- You could also make a whole document using !+tab -->
